<div *ngIf="loading" class="alert alert-info">
  Cargando usuario...
</div>

<div *ngIf="errorMessage" class="alert alert-danger">
  {{ errorMessage }}
</div>

<div *ngIf="user && !loading" class="row justify-content-center">

  <div class="col-12 col-lg-9">

    <div class="card shadow-sm">

      <div class="row g-0">

        <div class="col-md-5">
          <img
            [src]="user.image"
            class="img-fluid user-detail-image"
            [alt]="user.first_name + ' ' + user.last_name">
        </div>

        <div class="col-md-7">

          <div class="card-body">

            <h1 class="card-title mb-4">
              {{ user.first_name }} {{ user.last_name }}
            </h1>

            <p>
              <strong>Nombre:</strong>
              {{ user.first_name }}
            </p>

            <p>
              <strong>Apellidos:</strong>
              {{ user.last_name }}
            </p>

            <p>
              <strong>Nombre de usuario:</strong>
              {{ user.username }}
            </p>

            <p>
              <strong>Email:</strong>
              {{ user.email }}
            </p>

            <div class="d-flex flex-wrap gap-2 mt-4">

              <button
  type="button"
  class="btn btn-danger"
  (click)="deleteUser()">
  Eliminar
</button>

              <button
                type="button"
                class="btn btn-warning"
                (click)="goToUpdate()">
                Actualizar
              </button>

              <button
                type="button"
                class="btn btn-secondary"
                (click)="goBack()">
                Volver al listado
              </button>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
